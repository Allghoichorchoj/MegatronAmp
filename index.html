<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Megatron Tube Amp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel:linear-gradient(180deg,#d9dbdc,#b4b7b9 60%,#a3a6a8);
  --ink:#161718; --well:#8d9092; --glow:#ff9a4a; --plate:#5a2a1a;
  --meter:linear-gradient(0deg,#3c8c4e,#9fd37a); --cap:#c9ccce;
  --sel-bg:#f4f5f5; --sel-ink:#161718; --off-ink:#161718;
  --field:#eceeef; --field-ink:#161718;
  --ok:#14853a; --amber:#d9691a;
}
[data-skin="midnight"]{
  --panel:linear-gradient(180deg,#30343a,#1f2226 60%,#191b1e);
  --ink:#ffffff; --well:#0f1113; --glow:#39ff6e; --plate:#0c3a1a;
  --meter:linear-gradient(0deg,#12a83f,#8dffad); --cap:#3a3f46;
  --sel-bg:#ebe8e2; --sel-ink:#15171a; --off-ink:#ffffff;
  --field:#15171a; --field-ink:#ffffff;
  --ok:#39ff6e; --amber:#f2a42c;
}
[data-skin="brass"]{
  --panel:linear-gradient(180deg,#d8b67a,#b28a4e 60%,#9a7440);
  --ink:#24170a; --well:#7a5a2e; --glow:#ffc35c; --plate:#4a2a10;
  --meter:linear-gradient(0deg,#a8561c,#ffd27a); --cap:#e2c48c;
  --sel-bg:#fbf1dc; --sel-ink:#24170a; --off-ink:#fbf1dc;
  --field:#f3e3c2; --field-ink:#24170a;
  --ok:#1b7a34; --amber:#b5540f;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;min-height:100%}
/* plugin UI: no text selection (and never the blue highlight) */
.amp,.amp *{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
::selection{background:#1d6b33;color:#fff}
body{display:flex;justify-content:center;padding:24px 16px;font-family:'IBM Plex Sans Condensed',system-ui,sans-serif}
button,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #39ff6e;outline-offset:2px}
.io select{accent-color:#39ff6e}
.io select:focus,.io select:focus-visible{outline:2px solid #39ff6e;outline-offset:1px;border-color:#39ff6e}
.io select option:checked{background:#1d6b33;color:#fff}
.dial:focus,.dial:focus-visible{outline:none}
.tube:focus{outline:none}
.tube:focus-visible,.tube.drag{outline:2px solid #fff;outline-offset:3px}

.amp{position:relative;width:100%;max-width:900px;border-radius:12px;padding:18px;background:var(--panel);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(0,0,0,.35),0 20px 50px rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:0 6px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:'Libre Bodoni',serif;font-size:24px;letter-spacing:.06em}
.brand span{font-size:12px;letter-spacing:.18em;opacity:.85}
.lbl{font-size:12px;font-weight:600;letter-spacing:.18em}
.seg{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--well);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.seg button{border:0;border-radius:6px;padding:0 14px;height:32px;min-width:78px;font-size:13px;font-weight:600;letter-spacing:.06em;background:transparent;color:var(--off-ink)}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:10px}

.io{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.io label{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.14em}
.io select{height:30px;border-radius:6px;border:1px solid rgba(0,0,0,.35);background:var(--field);color:var(--field-ink);padding:0 8px;font-size:13px;letter-spacing:0;min-width:0}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:0 6px}
.btn{height:40px;padding:0 18px;border-radius:8px;border:1px solid rgba(0,0,0,.4);font-weight:600;letter-spacing:.1em;font-size:13px;
  background:linear-gradient(180deg,#f6f6f6,#c9cbcd);color:#161718;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.btn.on{background:linear-gradient(180deg,#4b4f54,#2a2d31);color:#fff}
.btn.power[aria-pressed="true"]{background:linear-gradient(180deg,#ffb27a,#e5702b);color:#2a1103}
.switches{position:relative;height:88px;width:100%}
#switches{height:auto}
#switches > .io{position:relative}
.switches > .sw,.switches > .knob{position:absolute;top:0;left:0;transform:translateX(-50%)}
.switches > .knob.mini .dial{margin-top:0}
.bolts{position:absolute;inset:0;pointer-events:none}
.bolt{position:absolute;left:0;top:0;width:30px;height:56px;transform:translate(-50%,-50%)}
.bolt svg{width:100%;height:100%;display:block}
/* LED tuner: black well at the bottom of the amp, same width as the curve area */
.tuner{container:tuner/inline-size;align-self:center;margin-top:10px;max-width:100%;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:0;padding:5px 12px;border-radius:7px;box-sizing:border-box;min-width:0;background:linear-gradient(180deg,#080a0a,#0d1011);box-shadow:inset 0 2px 8px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.25)}
.tn-leds{display:flex;align-items:center;gap:2px;width:100%}
.tuner .tri{flex:1 1 0;min-width:0;height:14px;display:block;transition:filter .1s}
.tuner .tri b{display:block;width:100%;height:100%;background:var(--d);transition:background .1s}
.tuner .tri.l b{clip-path:polygon(0 0,100% 50%,0 100%)}
.tuner .tri.r b{clip-path:polygon(100% 0,0 50%,100% 100%)}
.tuner .tri.on{filter:drop-shadow(0 0 5px var(--l))}
.tuner .tri.on b{background:var(--l)}
.tuner .win{flex:5 1 0;min-width:0;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-weight:700;font-size:clamp(11px,2.2cqi,15px);letter-spacing:.02em;line-height:1;color:#5d6862;background:#12301a;transition:background .1s,box-shadow .1s,color .1s}
.tuner .win.live{color:#e8ece9}
.tuner .win sub{font-size:.75em;font-weight:600;vertical-align:baseline;position:relative;top:.15em;margin-left:1px}
.tuner .win.on{background:#39ff6e;color:#04210d;box-shadow:0 0 12px rgba(57,255,110,.8)}
@media (prefers-reduced-motion:reduce){.tuner .tri,.tuner .tri b,.tuner .win{transition:none}}
.screen{position:relative}
.dbedit{position:absolute;left:0;top:0;width:66px;height:22px;transform:translate(-50%,-50%);box-sizing:border-box;padding:0 6px;border-radius:4px;border:1px solid #39ff6e;background:#0b0d0c;color:#fff;font:600 12px 'IBM Plex Sans Condensed',sans-serif;text-align:center;font-variant-numeric:tabular-nums;outline:none;box-shadow:0 0 8px rgba(57,255,110,.35);display:none;z-index:5}
.dbedit.open{display:block}
.dbedit::selection{background:#1d6b33;color:#fff}
.grip{position:absolute;right:4px;bottom:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:nwse-resize;touch-action:none;color:rgba(255,255,255,.45);border-radius:4px}
.grip:hover,.grip.drag{color:#fff}
.grip svg{width:14px;height:14px}
.grip .gp{position:absolute;right:26px;bottom:2px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.grip.drag .gp,.grip:focus-visible .gp{opacity:1}
.led{display:inline-block;vertical-align:-1px;width:10px;height:10px;margin-left:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#24542f,#06200d 70%);
  box-shadow:0 0 0 2px #9da2a6,0 0 0 3px rgba(0,0,0,.6),inset 0 1px 2px rgba(0,0,0,.7);transition:background .15s,box-shadow .15s}
.led.on{background:radial-gradient(circle at 35% 30%,#f0fff3 0%,#7dff9f 30%,#22e05a 60%,#0a6b25 100%);
  box-shadow:0 0 0 2px #c9cdd0,0 0 0 3px rgba(0,0,0,.6),0 0 10px 3px rgba(57,255,110,.6)}
.sw{display:flex;flex-direction:column;align-items:center;gap:2px}
.swn{font-size:11px;font-weight:600;letter-spacing:.16em}
.toggle{display:flex;align-items:center;gap:3px;border:0;background:transparent;padding:2px 2px;color:inherit;border-radius:8px}
.toggle svg{width:40px;height:60px;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.toggle .lever{transform-box:view-box;transform-origin:30px 46px;transition:transform .12s cubic-bezier(.5,1.6,.6,1)}
.toggle[aria-checked="false"] .lever{transform:scaleY(-1)}
.status:empty{display:none}
.status{font-size:12px;width:100%;text-align:center;padding:4px 30px 0;box-sizing:border-box}
.status.err{font-weight:600}
.warn{font-size:12px;opacity:.9}

.display{display:flex;align-items:stretch;gap:18px;height:136px}
.meterbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:12px}
/* compressor threshold line on each meter */
.thr{position:absolute;left:50%;top:0;width:12px;height:14px;transform:translate(-50%,-50%);cursor:ns-resize;touch-action:none;z-index:3;outline:none}
.thr::before{content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;margin-top:-1px;background:#fff}
.thr .tv{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.8);padding:1px 5px;border-radius:3px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.thr.left .tv{left:calc(100% + 4px)}
.thr.right .tv{right:calc(100% + 4px)}
.thr.show .tv,.thr:focus-visible .tv{opacity:1}
.meter{flex:1;width:12px;border-radius:6px;background:#1b1d1c;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.meter i{display:block;height:0;background:var(--meter)}
.meter i.clip{background:#e5484d}
.meterbox span{font-size:11px;font-weight:600}
.screen{flex:1;display:flex;flex-direction:column;border-radius:6px;padding:8px;background:#0d0f0e;box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.25);min-width:0}
.screen canvas{width:100%;flex:1;min-height:0;display:block;touch-action:none;cursor:ns-resize;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tubes{position:relative;height:146px;border-radius:6px;overflow:hidden;color:#c9ced3;background:linear-gradient(180deg,#050607 0%,#0b0d0f 55%,#14171a 82%,#1d2125 100%);box-shadow:inset 0 12px 18px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.07),inset 10px 0 14px rgba(0,0,0,.6),inset -10px 0 14px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.1)}
.tubes::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.04));pointer-events:none}
.xfmrs{position:absolute;inset:0;z-index:0;pointer-events:none}
/* shadow over the transformers: they recede into the chassis as background detail */
.xfmrs::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.35) 100%),
             radial-gradient(ellipse 55% 90% at 50% 100%,rgba(0,0,0,0),rgba(0,0,0,.35))}
.xfmr{position:absolute;bottom:0;left:0;transform:translateX(-50%);filter:blur(.7px) brightness(.62) contrast(.85)} /* depth of field: transformers sit further back */
.xfmr svg{display:block;width:100%;height:100%}
.xfmr.big{width:96px;height:108px}
.xfmr.small{width:72px;height:81px}
.tube{position:absolute;bottom:0;left:0;width:38px;isolation:isolate;z-index:1;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;cursor:ns-resize;border-radius:999px 999px 4px 4px}
.tube.off .glass{opacity:.55}
@keyframes tubeNope{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 4px))}40%{transform:translateX(calc(-50% + 4px))}60%{transform:translateX(calc(-50% - 3px))}80%{transform:translateX(calc(-50% + 2px))}}
.tube.nope{animation:tubeNope .35s ease}
.glass .guts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glass .guts .fil{stroke:#4a4f4c}
.tube:not(.off) .glass .guts .fil{stroke:#9dffb8;filter:drop-shadow(0 0 1.5px #39ff6e)}
/* switched-on tubes: steady green outer glow, a bit stronger with signal */
.tube:not(.off) .glass{
  --g:calc(var(--drive,.5) * var(--drive,.5));
  filter:drop-shadow(0 0 calc(2px + var(--g) * 12px + var(--heat,0) * 6px) rgba(57,255,110,calc(.35 + var(--drive,.5) * .55)))
         drop-shadow(0 0 calc(6px + var(--g) * 34px + var(--heat,0) * 14px) rgba(57,255,110,calc(.1 + var(--drive,.5) * .4)));
  transition:filter .2s}
.tube:not(.off) .plate{box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 calc(var(--heat,0) * 16px + var(--drive,.5) * 14px) #39ff6e}
.tube:not(.off) .plate::after{opacity:max(var(--heat,0), calc(var(--drive,.5) * .75))}
.tube:not(.off) .glass .guts .fil{filter:drop-shadow(0 0 calc(1px + var(--drive,.5) * 4px) #39ff6e)}
.tube:not(.off)::before{opacity:max(var(--heat,0), calc(var(--drive,.5) * .8))}
.tube.off .tl{opacity:.5}
.tube .tl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
.tube .drv{position:absolute;top:40px;left:50%;transform:translate(-50%,-50%);z-index:3;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff;background:rgba(0,0,0,.72);padding:1px 5px;border-radius:3px;opacity:0;transition:opacity .15s;pointer-events:none}
.tube:hover .drv,.tube:focus-visible .drv,.tube.drag .drv{opacity:1}
.glass{width:100%;height:80px;border-radius:999px 999px 5px 5px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 18% at 50% 4%, rgba(10,12,14,.95), rgba(40,44,48,.6) 60%, transparent 100%),
    linear-gradient(90deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,.015) 45%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.32) 88%,rgba(255,255,255,.12) 100%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 0 calc(var(--heat,0)*26px) color-mix(in srgb,var(--glow) 55%,transparent),0 0 calc(var(--heat,0)*22px) color-mix(in srgb,var(--glow) 40%,transparent)}
.glass::after{content:"";position:absolute;top:14%;left:16%;width:13%;height:58%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 70%,rgba(255,255,255,0));filter:blur(.3px)}
.glass::before{content:"";position:absolute;left:8%;right:8%;bottom:0;height:22%;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0));z-index:1}
.plate{position:relative;width:46%;height:46%;margin-top:6%;border-radius:2px;transition:none;
  background:linear-gradient(90deg,#1c1e20,#3d4144 30%,#55595d 50%,#3a3e41 70%,#1a1c1e);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 calc(var(--heat,0)*16px) var(--glow)}
.plate::before{content:"";position:absolute;inset:-12% -10%;border-top:1px solid rgba(150,155,160,.5);border-bottom:1px solid rgba(150,155,160,.5)}
.plate::after{content:"";position:absolute;inset:0;border-radius:2px;background:radial-gradient(ellipse at 50% 55%,var(--glow) 0%,color-mix(in srgb,var(--glow) 40%,transparent) 45%,transparent 75%);opacity:var(--heat,0);mix-blend-mode:screen}
.base{position:relative;width:124%;height:16px;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#2a2c2f 0%,#121315 35%,#0a0b0c 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.6)}
.base::after{content:"";position:absolute;left:12%;right:12%;top:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.08)}
.tube::before{content:"";position:absolute;left:50%;bottom:30%;width:300%;height:120%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 35%,transparent),transparent);opacity:var(--heat,0);pointer-events:none;z-index:-1}
.tube::after{content:"";position:absolute;left:50%;bottom:-3px;width:170%;height:8px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);pointer-events:none;z-index:-1}

.knobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 10px}
.tank{position:relative;height:46px;margin:0;border-radius:6px;background:linear-gradient(180deg,#0b0c0c,#151716 50%,#0b0c0c);box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.25)}
.tank canvas{width:100%;height:100%;display:block}
.tank span{position:absolute;right:10px;top:6px;font-size:10px;font-weight:600;letter-spacing:.18em;color:#8b938d}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px}
.wordmark{display:flex;justify-content:space-between;align-items:baseline;margin-top:-4px;margin-bottom:0;padding:0 0 3px;border-bottom:2px solid #fff;font-family:'Libre Bodoni',serif;font-weight:700;font-size:26px;line-height:1;text-shadow:0 -1px 0 rgba(0,0,0,.35)}
.wordmark span{display:block}
@media (max-width:640px){.wordmark{font-size:20px;padding:0 24px}}
.knob .n{font-size:12px;letter-spacing:.18em;font-weight:600;margin-top:2px}
.dial{width:104px;max-width:100%;aspect-ratio:1;touch-action:none;cursor:ns-resize;border-radius:50%}
.knob.mini{gap:0}
.knob.mini .n{font-size:11px;letter-spacing:.16em;margin-top:0}
.knob.mini .dial{width:62px}
.knob.mini .dial svg text{font-size:11px}
.knob.mini .val{font-size:11px}
.knob.small .dial{width:59px;margin:auto 0}
.knob.small .dial svg text{display:none}
.dial svg{width:100%;height:100%;display:block}
.knob{position:relative}
/* labels (and diodes) sit under their controls */
.knob .dial{order:1}
.knob .n{order:2}
.sw{flex-direction:column-reverse}
.sw .swn{margin-top:4px}
#switches > .sw:first-child .swn{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
#switches > .sw:first-child .led{margin-left:0}
.io .pwr{flex:0 0 auto;padding:0 4px 0 2px}
.io .pwr .swn{display:none}
#led{display:none} /* the rocker lights itself */
.rocker{width:30px;height:46px;display:block}
.rocker .rk-on,.rocker .rk-glow{opacity:0;transition:opacity .12s}
#power[aria-checked="true"] .rocker .rk-on{opacity:1}
#power[aria-checked="true"] .rocker .rk-glow{opacity:.75}
#power[aria-checked="true"] .rocker .rk-off{opacity:0}
#pwrLbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} /* hidden text, still read out as the switch name */
.val{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:1px 6px;border-radius:4px;background:transparent;color:#fff;opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
.knob.turning .val{opacity:1}
.hint{text-align:center;font-size:12px;opacity:.85;padding-bottom:4px}

@media (max-width:640px){
  .display{height:130px}
  .tubes{height:146px}
  .tube .tl{font-size:9px;letter-spacing:.06em}
  .glass{height:80px}
  .knobs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<main class="amp" id="amp" data-skin="midnight">

  <div class="actions">
  <div class="switches" id="switches" role="group" aria-label="Power and tube switches">
  <section class="io" aria-label="Audio routing">
      <div class="sw pwr">
        <span class="swn"><span id="pwrLbl">POWER</span><span class="led" id="led" aria-hidden="true"></span></span>
        <button type="button" class="toggle" id="power" role="switch" aria-checked="false" aria-labelledby="pwrLbl">
        <svg class="rocker" viewBox="0 0 40 60" aria-hidden="true">

<script>
(function(){
  "use strict";
  // the plugin remembers nothing between sessions: storage is a no-op, and old saved settings are wiped once
  try { Object.keys(window.localStorage).forEach(function(k){ if (k.indexOf("megatron-") === 0 || k.indexOf("valve6-") === 0) window.localStorage.removeItem(k); }); } catch(e){}
  var localStorage = { getItem:function(){ return null; }, setItem:function(){}, removeItem:function(){} };
  var $ = function(id){ return document.getElementById(id); };
  var amp = $("amp");
  var UI_SCALE = 1;
  try { var us = parseFloat(localStorage.getItem("megatron-scale")); if (us >= 0.6 && us <= 1.6) UI_SCALE = us; } catch(e){}

  /* ---------- skins ---------- */
  var savedSkin = null;
  try { savedSkin = localStorage.getItem("megatron-skin"); } catch(e){}
  function setSkin(s){
    amp.dataset.skin = s;
    document.querySelectorAll("#skins button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.skin === s ? "true" : "false"); });
    try { localStorage.setItem("megatron-skin", s); } catch(e){}
    drawCurve();
  }

  /* ---------- tubes ---------- */
  var plates = [], tubeEls = [], tubeSw = [], tubeLeds = [];
  // diodes: POWER lights when running; each tube lights when its switch is on and the amp is powered
  function updateLeds(){
    var on = typeof running !== "undefined" && running;
    var pl = document.getElementById("led"); if (pl) pl.classList.toggle("on", !!on);
    tubeLeds.forEach(function(l, k){ l.classList.toggle("on", !!on && tubeOn[k]); });

  cv.addEventListener("pointercancel", endDrag);
  cv.addEventListener("dblclick", function(e){ autoPt(nearest(e)); save(); });


  cv.addEventListener("focus", function(){ readout.textContent = ptText(focusPt); drawCurve(); });
  cv.addEventListener("blur", drawCurve);
  cv.addEventListener("keydown", function(e){
    var step = e.shiftKey ? 0.01 : 0.05;
    if (e.key === "ArrowLeft"){ focusPt = Math.max(0, focusPt - 1); readout.textContent = ptText(focusPt); drawCurve(); }
    else if (e.key === "ArrowRight"){ focusPt = Math.min(7, focusPt + 1); readout.textContent = ptText(focusPt); drawCurve(); }
    else if (e.key === "ArrowUp"){ setPt(focusPt, pts[focusPt] + step); save(); }
    else if (e.key === "ArrowDown"){ setPt(focusPt, pts[focusPt] - step); save(); }
    else return;
    e.preventDefault();
  });

  /* ---------- plugin size (bottom-right grip) ---------- */
  function applyScale(k, persist){
    UI_SCALE = Math.max(0.6, Math.min(1.6, Math.round(k * 100) / 100));
    amp.style.zoom = UI_SCALE;
    $("gripPct").textContent = Math.round(UI_SCALE * 100) + "%";
    $("grip").setAttribute("aria-valuenow", Math.round(UI_SCALE * 100));
    if (persist){ try { localStorage.setItem("megatron-scale", UI_SCALE); } catch(e){} }
    layoutTubes(); drawCurve(); drawSprings(running);
  }
  (function(){
    var g = $("grip"), x0 = 0, y0 = 0, k0 = 1, w0 = 1, on = false;
    g.addEventListener("pointerdown", function(e){ on = true; x0 = e.clientX; y0 = e.clientY; k0 = UI_SCALE; w0 = amp.getBoundingClientRect().width; g.setPointerCapture(e.pointerId); g.classList.add("drag"); e.preventDefault(); });
    g.addEventListener("pointermove", function(e){ if (!on) return; var d = Math.max(e.clientX - x0, (e.clientY - y0) * 1.2); applyScale(k0 * (w0 + d) / w0, false); });
    function end(){ if (!on) return; on = false; g.classList.remove("drag"); applyScale(UI_SCALE, true); }
    g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
    g.addEventListener("dblclick", function(){ applyScale(1, true); });
    g.addEventListener("keydown", function(e){
      if (e.key === "ArrowUp" || e.key === "ArrowRight") applyScale(UI_SCALE + 0.05, true);
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") applyScale(UI_SCALE - 0.05, true);
      else return; e.preventDefault();
    });
  })();

  /* ---------- init ---------- */
  setTimeout(function(){ applyScale(UI_SCALE, false); drawSprings(false); }, 0);
  if (!offs){ offs = [0, 0, 0, 0, 0, 0]; autoStages(); } // first load: natural staging (a straight line at GAIN 5 / VOLUME 5)
  tubeEls.forEach(function(t, k){ syncTube(k); });
  layoutTubes();
  Object.keys(vals).forEach(function(k){ setVal(k, vals[k]); });
  setSkin("midnight");
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawCurve);
})();
</script>
</body>
